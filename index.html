<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 起名平台 · 多模型流式生成</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b25; --panel-2:#1f2330; --line:#2a2f3d;
    --text:#e8eaf0; --muted:#8b90a3; --brand:#7c6cff; --brand-2:#39d0c4;
    --warn:#ffb020; --err:#ff5c5c; --ok:#3ddc84;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 15% -10%,#252a4a 0%,transparent 60%),
               radial-gradient(900px 500px at 90% 0%,#1d3a3a 0%,transparent 55%),var(--bg);
    color:var(--text); min-height:100vh; padding:36px 16px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{text-align:center;margin-bottom:30px}
  header h1{
    font-size:32px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(120deg,#a99bff,#66e3d8 60%,#8fb4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:14px;margin-top:10px}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
  .card h2{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  textarea{
    width:100%;min-height:96px;resize:vertical;background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.6;
    font-family:inherit;outline:none;transition:.2s;
  }
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,108,255,.15)}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  select{
    flex:1;min-width:150px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;cursor:pointer;
  }
  select:focus{border-color:var(--brand)}
  button{
    padding:12px 26px;border:none;border-radius:12px;font-size:15px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--brand),#5b8cff);cursor:pointer;font-family:inherit;
    transition:.18s;white-space:nowrap;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,108,255,.35)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{
    font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--panel-2);
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s
  }
  .chip:hover{color:var(--text);border-color:var(--brand)}
  .output{
    min-height:320px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
    padding:18px;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
    overflow-y:auto;max-height:560px;
  }
  .output h3{font-size:17px;margin:14px 0 6px;color:#c6c9ff}
  .output strong{color:#ffe9a8}
  .placeholder{color:var(--muted)}
  .status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.live{background:var(--ok);animation:pulse 1s infinite}
  .dot.err{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .cursor{display:inline-block;width:7px;height:16px;background:var(--brand-2);vertical-align:-3px;animation:blink .9s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .hist-item{
    padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
    background:var(--panel-2);cursor:pointer;transition:.15s
  }
  .hist-item:hover{border-color:var(--brand);transform:translateX(2px)}
  .hist-item .q{font-size:14px;color:var(--text);margin-bottom:6px}
  .hist-item .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(124,108,255,.18);color:#b9aeff}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}
  footer{text-align:center;color:#5b6076;font-size:12px;margin-top:36px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 起名平台</h1>
    <p>输入需求 → 选择模型 → 实时流式生成 3 组名字与寓意</p>
  </header>

  <div class="grid">
    <!-- 左：输入 + 输出 -->
    <div>
      <div class="card">
        <h2>起名需求</h2>
        <textarea id="req" placeholder="例如：姓李，男孩，国风，希望寓意光明磊落、有书卷气"></textarea>
        <div class="chips" id="chips">
          <span class="chip">姓李 · 男孩 · 国风</span>
          <span class="chip">姓陈 · 女孩 · 古典诗意</span>
          <span class="chip">姓王 · 中性 · 现代简约</span>
          <span class="chip">英文名 · 女生 · 优雅</span>
        </div>
        <div class="row">
          <select id="model">
            <option value="qwen">通义千问</option>
          </select>
          <button id="go">开始起名</button>
        </div>
        <div class="status"><span class="dot" id="dot"></span><span id="status">等待输入</span></div>
      </div>

      <div class="card" style="margin-top:18px">
        <h2>生成结果</h2>
        <div class="output" id="out"><span class="placeholder">结果会在这里逐字出现……</span></div>
      </div>
    </div>

    <!-- 右：历史 -->
    <div class="card">
      <h2>历史记录</h2>
      <div id="hist"><div class="empty">暂无记录</div></div>
    </div>
  </div>

  <footer>
    Node.js + Vercel Serverless · SSE 流式输出 · Supabase 存储<br>
    密钥全部走环境变量，代码中无明文
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const outEl = $('out'), statusEl = $('status'), dotEl = $('dot'), goBtn = $('go');

// 输入框上方的快捷示例
$('chips').addEventListener('click', (e) => {
  if (e.target.classList.contains('chip')) $('req').value = e.target.textContent;
});

function setStatus(text, state) {
  statusEl.textContent = text;
  dotEl.className = 'dot' + (state ? ' ' + state : '');
}

/** 极简 Markdown 渲染：只处理 ## 标题、**加粗**、- 列表 */
function render(md) {
  const esc = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/^##\s*(.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

async function generate() {
  const requirement = $('req').value.trim();
  if (!requirement) {
    setStatus('请先填写起名需求', 'err');
    $('req').focus();
    return;
  }

  goBtn.disabled = true;
  outEl.innerHTML = '<span class="cursor"></span>';
  setStatus('正在连接模型…', 'live');

  let buffer = '';
  let firstToken = true;

  try {
    const resp = await fetch('/api/name', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requirement, model: $('model').value })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || ('请求失败 ' + resp.status));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let pending = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      pending += decoder.decode(value, { stream: true });
      const events = pending.split('\n\n');
      pending = events.pop() || '';

      for (const evt of events) {
        const line = evt.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;

        let msg;
        try { msg = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (msg.error) throw new Error(msg.error);

        if (msg.delta) {
          if (firstToken) { firstToken = false; buffer = ''; setStatus('正在生成…', 'live'); }
          buffer += msg.delta;
          outEl.innerHTML = render(buffer) + '<span class="cursor"></span>';
          outEl.scrollTop = outEl.scrollHeight;
        }

        if (msg.done) {
          outEl.innerHTML = render(buffer);
          setStatus(msg.saved ? '完成 · 已保存到历史记录' : '完成 · 未保存（Supabase 未配置或写入失败）', '');
          loadHistory();
        }
      }
    }
  } catch (err) {
    outEl.innerHTML = render(buffer) || '<span class="placeholder">没有生成内容</span>';
    setStatus('出错：' + err.message, 'err');
  } finally {
    goBtn.disabled = false;
    if (!buffer) outEl.innerHTML = '<span class="placeholder">结果会在这里逐字出现……</span>';
  }
}

async function loadHistory() {
  const box = $('hist');
  try {
    const r = await fetch('/api/history?limit=20');
    const j = await r.json();
    const list = j.data || [];
    if (!list.length) {
      box.innerHTML = '<div class="empty">暂无记录</div>';
      return;
    }
    box.innerHTML = list.map(item => `
      <div class="hist-item" data-id="${item.id}">
        <div class="q">${escapeHtml(item.user_requirement).slice(0, 42)}</div>
        <div class="m">
          <span class="badge">${escapeHtml(item.model_name)}</span>
          <span>${new Date(item.created_at).toLocaleString('zh-CN')}</span>
        </div>
      </div>`).join('');

    box.querySelectorAll('.hist-item').forEach((el, i) => {
      el.addEventListener('click', () => {
        outEl.innerHTML = render(list[i].name_result);
        setStatus('已载入历史记录', '');
      });
    });
  } catch {
    box.innerHTML = '<div class="empty">历史记录加载失败</div>';
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** 读取后端配置了哪些模型，禁掉没配密钥的选项 */
async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const j = await r.json();
    const sel = $('model');
    const list = j.models || [];
    if (!list.length) return;
    sel.innerHTML = '';
    let first = null;
    list.forEach(m => {
      const o = document.createElement('option');
      o.value = m.key;
      o.textContent = m.available ? m.label : m.label + '（未配置）';
      o.disabled = !m.available;
      if (m.available && !first) first = m.key;
      sel.appendChild(o);
    });
    if (first) {
      sel.value = first;
    } else {
      setStatus('还没有配置任何模型密钥，请先在 Vercel 环境变量里配置', 'err');
      goBtn.disabled = true;
    }
  } catch (e) {
    /* 拉取失败就保留默认选项，不影响主流程 */
  }
}

goBtn.addEventListener('click', generate);
$('req').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
});
loadModels();
loadHistory();
</script>
</body>
</html>
